name: puzzles_numeral
description: "Puzzles Numeral — a triangle matching game, played against a bot."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# Deliberately no third-party packages: everything the game needs ships with
# the Flutter SDK, so `flutter pub get` cannot fail on a version conflict.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
